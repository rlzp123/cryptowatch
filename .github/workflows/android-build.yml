name: Build Android APK - CryptoWatch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Gerar build web (React + Vite)
        run: npm run build

      - name: Adicionar plataforma Android (caso não esteja versionada)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Gerar Ícones e Splash Screens Nativos (@capacitor/assets)
        run: npx capacitor-assets generate --android

      - name: Sincronizar projeto Capacitor com Android
        run: npx cap sync android

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug via Gradle
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar Artefato meu-aplicativo-apk
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
